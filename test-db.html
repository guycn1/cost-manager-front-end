<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>db.js sanity check</title>
</head>
<body>
    <!-- Loads the vanilla library and runs a small check in the console. -->
    <script src="db.js"></script>
    <script>
        /*
         * A trimmed version of the sample check from the project brief.
         * Open this page in a browser and read the console output.
         */
        function test() {
            try {
                // Start from an empty store so re-runs are reproducible.
                localStorage.removeItem("costsdb:costsdb:v1");
                const ob = db.openCostsDB("costsdb", 1);
                // Add two cost items and confirm each call returned.
                const first = {
                    sum: 200, currency: "USD", category: "FOOD", description: "pizza"
                };
                const second = {
                    sum: 400, currency: "USD", category: "CAR", description: "fuel"
                };
                const result1 = ob.addCost(first);
                const result2 = ob.addCost(second);
                if (ob) {
                    console.log("creating db succeeded");
                }
                if (result1) {
                    console.log("adding 1st cost item succeeded");
                }
                if (result2) {
                    console.log("adding 2nd cost item succeeded");
                }
                // The report total for the two USD items should be 600.
                const data = ob.getReport("USD");
                console.log(data.total.sum);
            } catch (exception) {
                console.log(exception.message);
            }
        }
        test();
    </script>
</body>
</html>
