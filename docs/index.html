    <p>
        This host serves the currency exchange rates used by the Cost Manager
        application. The rates are exposed as a static JSON document:
    </p>

        <a href="exchange-rates.json">exchange-rates.json</a>

        ILS means that 3.7 ILS are equivalent to 1 USD.
